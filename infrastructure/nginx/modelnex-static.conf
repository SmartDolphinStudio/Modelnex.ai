server {
    listen 80;
    listen [::]:80;
    server_name modelnex.ai www.modelnex.ai docs.modelnex.ai log.modelnex.ai astraeus.modelnex.ai;

    root /var/www/modelnex-static;
    index index.html;
    charset utf-8;
    server_tokens off;

    location ^~ /api/ {
        default_type application/json;
        return 410 '{"message":"This static showcase has no API service."}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|map|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        try_files $uri =404;
